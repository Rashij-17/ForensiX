name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libsndfile1
      - run: pip install -r requirements.txt && pip install -e . --no-deps
      - run: python -m flake8 forensix api frontend sdk scripts --max-line-length 140 --extend-ignore E203,W503,E731 --select E9,F63,F7,F82
      - run: python -m pytest
        env: { MLFLOW_DISABLE_AGENT_HINT: "1" }
