# ForensiX configuration. Every value here can be overridden; missing keys fall
# back to the defaults in forensix/config.py.

seed: 42

versions:
  preprocessing: pp-1      # bump when preprocessing changes (recorded in metadata + dataset versions)
  feature: ft-1            # bump when feature definitions change

data:
  raw_dir: data/raw
  splits: {train: 0.70, val: 0.15, test: 0.15}

image:
  size: 256                # common resolution (square) used for all feature extraction

audio:
  sr: 16000                # common sampling rate
  segment_seconds: 4.0     # long recordings are cut into segments of this length
  max_segments: 3          # features are averaged over at most this many segments
  min_seconds: 0.5         # shorter recordings are rejected as invalid
  silence_db: -55.0        # recordings quieter than this (RMS dBFS) are rejected as silent

video:
  size: 128                # frames are resized to size x size
  frame_interval: 2        # every n-th frame is sampled (fixed interval)
  max_frames: 24           # at most this many sampled frames per video
  min_frames: 6            # fewer sampled frames than this -> rejected
  max_raw_frames: 120      # raw frames read from disk per video (bounds memory)
  max_side: 320            # raw frames are downscaled so the longest side <= this

models:
  logistic_regression: {C: 1.0, max_iter: 3000}
  svm: {C: 3.0, kernel: rbf, gamma: scale}
  random_forest: {n_estimators: 300, max_depth: null, min_samples_leaf: 1}
  xgboost: {n_estimators: 300, max_depth: 4, learning_rate: 0.08, subsample: 0.9, colsample_bytree: 0.8}

training:
  selection_metric: f1     # best model per modality is chosen on the VALIDATION split
  cv_folds: 5              # cross-validation on the training split (reported, not used for selection)

decision:                  # calibrated-language bands on P(manipulated)
  authentic_below: 0.35
  manipulated_above: 0.65

shap:
  max_explain_samples: 150
  background_samples: 25
  top_k: 8

robustness:
  image:
    jpeg: [70, 30]         # JPEG quality
    resize: [0.75, 0.5]    # down-scale factor, then back up to original size
    blur: [1.0, 2.0]       # Gaussian sigma (pixels)
    noise: [4, 10]         # Gaussian noise sigma (0-255 scale)
  audio:
    bgnoise: [20, 10]      # background noise SNR (dB)
    mp3: [64, 32]          # MP3 bitrate (kbps) round trip
    resample: [11025, 8000]  # down-sample to this rate, then back up
  video:
    h264: [28, 38]         # H.264 CRF round trip (higher = stronger compression)
    downscale: [0.75, 0.5] # resolution reduction factor, then back up
    fps_div: [2, 3]        # keep every n-th frame (frame rate reduction)

generators:
  min_support: 5           # generators with fewer test samples are flagged "low support"

monitoring:
  window: 500              # most recent predictions considered
  min_samples: 30          # minimum logged predictions before drift is judged
  psi_threshold: 0.2       # PSI above this marks a feature as drifted
  drift_share_trigger: 0.30
  f1_drop_trigger: 0.05    # production F1 (verified labels) this far below baseline -> retrain
  min_labeled: 20          # minimum verified labels before performance is judged
  min_improvement: 0.0     # candidate must beat production F1 by more than this to be promoted

privacy:
  retain_uploads: false    # uploaded media is deleted right after analysis
  max_upload_mb: 200
